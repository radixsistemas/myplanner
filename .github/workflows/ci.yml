name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Gerar Prisma Client
        run: npm run db:generate -w apps/api

      - name: Typecheck da API
        run: npm run typecheck -w apps/api

      - name: Typecheck do frontend
        run: npm run typecheck -w apps/web

      - name: Build de produção do frontend
        run: npm run build -w apps/web
