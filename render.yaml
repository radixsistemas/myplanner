databases:
  - name: myplanner-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: myplanner-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    preDeployCommand: npm run db:migrate:deploy -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3333"
      - key: DATABASE_URL
        fromDatabase:
          name: myplanner-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      # Preencha manualmente no painel do Render (não vão para o git):
      - key: CORS_ORIGIN
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_DRY_RUN
        value: "false"
      - key: STALL_CHECK_CRON
        value: "0 8 * * *"
      - key: WEEKLY_SUMMARY_CRON
        value: "30 8 * * 1"
