services:
  postgres:
    image: postgres:16-alpine
    container_name: myplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myplanner
      POSTGRES_PASSWORD: myplanner
      POSTGRES_DB: myplanner
    ports:
      - "5432:5432"
    volumes:
      - myplanner_postgres_data:/var/lib/postgresql/data

volumes:
  myplanner_postgres_data:
